<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weather APP by gerardo sapida jr.">
    <meta author="Gerardo G. Sapida Jr." content="">
    <title>Weather-Forcast-app by GGS</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="asset/cloudrain.png" type="image/x-icon">
    <script src="script/script.js" defer></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>


    <div class="title">
        <img src="asset/cloudrain.png" alt="cloudlogo">
        <div class="title2">
            <h1 class="wthr">Weather</h1>
            <h1 class="frcst">Forecast</h1>
        </div>
        <h2>Project</h2>
    </div>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter Here!" class="search-bar">
            <i id="searching" class='bx bx-search-alt'></i>
        </div>
        <div class="weather loading">
            <h2 class="city"></h2>
            <h1 class="temp"></h1>
            <img src="" alt="" class="icon" />
            <div class="description"></div>
            <br>
            <br>
            <div class="humidity"></div>
            <div class="wind"></div>
        </div>
        <div id="datetime-container"></div>
    </div>
    <footer class="footer">
        <p>By Gerardo Sapida Jr.</p>
    </footer>


    <script src="script/preloader.js"></script>

</body>
